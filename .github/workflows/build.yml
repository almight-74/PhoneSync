name: build

on:
  push:
    branches: ["**"]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/dist/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk obsidian-widgets.apk && ls -l obsidian-widgets.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/obsidian-widgets.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plugin, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Release name (YYYYMMDD_widgets-v<version>)
        run: echo "NAME=$(date -u +%Y%m%d)_widgets-v${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      # BRAT looks up the release whose tag equals the manifest version, so the tag stays "x.y.z".
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.NAME }}
          files: |
            plugin/main.js
            plugin/manifest.json
            apk/obsidian-widgets.apk
