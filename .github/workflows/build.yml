name: build

on:
  push:
    branches: ["**"]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/dist/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk obsidian-widgets.apk && ls -l obsidian-widgets.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/obsidian-widgets.apk

  # Publishes a release whenever main (or a tag) carries a manifest version that has no release yet.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [plugin, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from manifest.json
        run: |
          V=$(jq -r .version manifest.json)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "NAME=$(date -u +%Y%m%d)_widgets-v$V" >> "$GITHUB_ENV"
          if gh release view "$V" >/dev/null 2>&1; then echo "EXISTS=1" >> "$GITHUB_ENV"; fi
      - if: env.EXISTS != '1'
        uses: actions/download-artifact@v4
        with:
          path: out
      # BRAT looks up the release whose tag equals the manifest version, so the tag stays "x.y.z".
      - if: env.EXISTS != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          files: |
            out/plugin/main.js
            out/plugin/manifest.json
            out/apk/obsidian-widgets.apk
